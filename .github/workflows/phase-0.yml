name: Project checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - name: Install Admin/CRM dependencies
        working-directory: web/admin
        run: npm ci --no-audit --no-fund
      - name: Test Admin/CRM
        working-directory: web/admin
        run: npm test -- --watch=false
      - name: Build Admin/CRM
        working-directory: web/admin
        run: npm run build

  ops-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: |
          cp .env.example .env.local
          docker compose --profile ops config --quiet
      - name: Build database operations image
        run: docker build --file infra/docker/ops.Dockerfile --tag pet-friendly-city-ops:ci .
      - name: Build Admin/CRM image
        run: docker build --file infra/docker/admin.Dockerfile --tag pet-friendly-city-admin:ci .
      - name: Smoke-test Admin/CRM container
        run: |
          docker run --detach --rm --name pet-friendly-admin-ci \
            --publish 127.0.0.1:18088:8080 \
            --env APP_ENV=ci \
            --env SUPABASE_URL=https://example.supabase.co \
            --env SUPABASE_ANON_KEY=ci-placeholder \
            pet-friendly-city-admin:ci
          trap 'docker stop pet-friendly-admin-ci' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:18088/healthz; then exit 0; fi
            sleep 1
          done
          docker logs pet-friendly-admin-ci
          exit 1

  kmp-interop:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Test JVM contract and link iOS framework
        run: ./gradlew --no-daemon --console=plain :mobile:shared:jvmTest :mobile:shared:linkDebugFrameworkIosSimulatorArm64
      - name: Type-check Swift bridge against shared framework
        run: |
          xcrun --sdk iphonesimulator swiftc \
            -typecheck \
            -target arm64-apple-ios18.0-simulator \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -F mobile/shared/build/bin/iosSimulatorArm64/debugFramework \
            mobile/iosApp/iosApp/Spikes/PlacePreviewViewModel.swift

  postgis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v2
        with:
          version: 2.117.0
      - name: Start database and apply migrations
        run: supabase db start
      - name: Lint database
        run: supabase db lint --local --level error
      - name: Run pgTAP tests
        run: supabase test db
