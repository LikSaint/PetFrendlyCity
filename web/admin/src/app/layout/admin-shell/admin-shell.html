<div class="shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/queue"><span class="brand-mark">P</span><span>Pet-Friendly<br />City</span></a>
    <nav aria-label="Основная навигация">
      <a routerLink="/queue" routerLinkActive="active"><span class="nav-icon">01</span>CRM очередь</a>
      <span class="disabled-link"><span class="nav-icon">02</span>Места <small>soon</small></span>
      <span class="disabled-link"><span class="nav-icon">03</span>Отчёты <small>soon</small></span>
    </nav>
    <div class="account">
      <div class="avatar">{{ identity()?.user?.email?.slice(0, 1)?.toUpperCase() || 'A' }}</div>
      <div class="account-copy"><strong>{{ identity()?.role }}</strong><span>{{ identity()?.user?.email }}</span></div>
      <button type="button" (click)="signOut()" aria-label="Выйти">↗</button>
    </div>
  </aside>
  <main class="content"><router-outlet /></main>
</div>
